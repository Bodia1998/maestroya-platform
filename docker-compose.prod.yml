# Production-shaped Docker Compose (Module 25 — Production Infrastructure).
#
# `docker-compose.yml` (unchanged by this module) remains the local-dev
# convenience file — Postgres only, app run via `npm run dev` on the
# host. This file is a reference/staging-equivalent production topology:
# the app runs containerized too, using the production `Dockerfile`.
# A real production deployment would typically run Postgres as a managed
# service (RDS, Cloud SQL, etc.) rather than the containerized instance
# below — that instance is included so this compose file is runnable
# end-to-end for staging/self-hosted use as-is.
#
# Database migrations are intentionally NOT run by the `app` service's
# own entrypoint — see the Dockerfile's own comment and
# docs/MODULE_25_PRODUCTION_INFRASTRUCTURE.md, "Database migration
# safety". Run `npm run prisma:migrate:deploy` (or the CI pipeline's own
# step) as a separate, explicit one-off command before starting/updating
# `app`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-maestroya}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Compose's own healthcheck mirrors the Dockerfile's HEALTHCHECK —
    # kept explicit here too so `docker compose ps` reflects readiness
    # without needing to inspect the image.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres-data:
