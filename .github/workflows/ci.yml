name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maestroya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/maestroya_test?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      RESEND_API_KEY: "re_ci_placeholder"
      EMAIL_FROM: "MaestroYa <noreply@maestroya.test>"
      AUTH_SECRET: "ci-only-placeholder-secret"
      AUTH_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      CLOUDINARY_CLOUD_NAME: "placeholder"
      CLOUDINARY_API_KEY: "placeholder"
      CLOUDINARY_API_SECRET: "placeholder"
      # Module 39 — Sentry + CI/CD Hardening: `next build` forces
      # NODE_ENV=production for the build step itself, and env.ts's
      # production `superRefine` requires SENTRY_DSN whenever NODE_ENV is
      # "production" outside the Next.js build phase (see that file's own
      # comment on NEXT_PHASE) — `next build` does set NEXT_PHASE, so this
      # placeholder isn't strictly required for the build step to pass,
      # but is set anyway so any future step/script that imports env.ts
      # under a forced production NODE_ENV (outside next build itself)
      # doesn't fail CI over a missing placeholder.
      SENTRY_DSN: "https://ci-placeholder@o0.ingest.sentry.io/0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma migrate (test DB)
        run: npm run prisma:migrate:deploy

      - name: Prisma migrate status
        run: npx prisma migrate status

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Real-DB integration tests (Module 91)
        # Module 91 — Real-Database Integration Test Harness: runs the
        # focused real-PostgreSQL suite (tests/integration-db/**) against
        # the SAME `postgres:16-alpine` service this job already
        # provisions and already migrated above (`Prisma migrate (test
        # DB)`) — no second Postgres service, no second schema. Uses
        # TEST_DATABASE_URL explicitly (rather than relying on the
        # job-level DATABASE_URL fallback) so this step's own safety
        # check (see tests/test-utils/db/test-database-url.ts) is
        # exercised the same way a local developer run exercises it.
        env:
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/maestroya_test?schema=public"
        run: npm run test:integration:db

      - name: Build
        run: npm run build
